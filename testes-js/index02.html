<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testes.com</title>
</head>
<body>
    <h1>Hello Word!</h1>
    <script>
        let nome = window.prompt("Qual o seu nome ? ")
        document.write(`Olá, <b>${nome}!</b> Seu nome contem ${nome.length} letras.<br>`)
        document.write(`${nome}, seu nome em maiusculo é ${nome.toUpperCase()}</br>`)
        document.write(`<b>${nome}</b>, seu nome em minusculo é ${nome.toLowerCase()}`)
    </script>
</body>
</html>
