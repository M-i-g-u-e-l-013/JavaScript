<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detran.com</title>
</head>
<body>
    <header>
        <h1>Sistema de Multas</h1>
    </header>
    <main>
        Velocidade do carro: <input type="number" name="txtvel" id="txtvel"> Km/h
        <input type="button" value="verificar" onclick="calcular()">
        <hr>
        <div id="res">

        </div>
    </main>
    <script>
        function calcular() {
            let txtv = window.document.getElementById("txtvel")
            let vel = Number(txtv.value)
            let res = window.document.querySelector("div#res")

            res.innerHTML = `A velocidade do seu carro é <strong>${vel}Km/h!<strong>`
            
            if (vel >= 60) {
                res.innerHTML = `<p>Você está <strong>MULTADO<strong> por excesso de velocidade!<p>`
            }

            res.innerHTML += `<p>Dirija sempre com um cinto de segurança<p>`
        }
    </script>
</body>
</html>
